<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Watch Together</title>
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0e0e10;color:#eee;font:16px system-ui,sans-serif;touch-action:manipulation}
#lobby{max-width:420px;margin:0 auto;padding:36px 20px;display:flex;flex-direction:column;gap:12px}
h1{font-size:26px}p.s{color:#999;font-size:14px;line-height:1.4}
input,button,select,.btn{font:inherit;padding:12px;border:1px solid #444;background:#1c1c1f;color:#eee;border-radius:8px}
button,.btn{background:#e5484d;border:0;font-weight:600;text-align:center;cursor:pointer}
.hide{display:none!important}

/* Stage: fullscreen landscape. If the phone stays in portrait, rotate it with CSS. */
#stage{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;overflow:hidden;user-select:none}
@media(orientation:portrait){#stage{left:100vw;width:100vh;height:100vw;transform-origin:0 0;transform:rotate(90deg)}}
#mw,#v{position:absolute;inset:0;width:100%;height:100%}
#mw iframe{width:100%;height:100%;border:0;pointer-events:none}
#v{object-fit:contain}

/* Tap zones: left/right = double-tap to skip, bottom quarter = open keyboard */
#zl,#zr,#zt{position:absolute;z-index:2}
#zl,#zr{top:0;height:75%;width:50%}#zl{left:0}#zr{right:0}
#zt{left:0;right:0;bottom:0;height:25%}
.fx{position:absolute;top:40%;left:50%;transform:translateX(-50%);padding:10px 16px;background:#0009;border-radius:30px;animation:fx .6s forwards}
@keyframes fx{to{opacity:0}}

#ctl{position:absolute;z-index:5;left:0;right:0;bottom:0;padding:8px 14px;background:linear-gradient(transparent,#000c);transition:opacity .2s}
#ctl.off{opacity:0;pointer-events:none}
#bar{width:100%;accent-color:#e5484d;padding:0;border:0;background:none}
#row{display:flex;gap:8px;align-items:center;font-size:14px}
#row button,#row select{padding:6px 10px;background:#ffffff26;color:#fff;font-size:14px;border-radius:6px}
#ci{position:absolute;z-index:9;top:8px;right:10px;padding:6px 10px;background:#ffffff26;font-size:18px;border-radius:6px}

/* Floating chat: dark grey boxes, square corners, near the bottom corners */
.fl{position:absolute;bottom:28%;width:40%;display:flex;flex-direction:column;gap:6px;pointer-events:none;z-index:4}
#fL{left:12px;align-items:flex-start}#fR{right:12px;align-items:flex-end}
.b{background:#2b2b2b;color:#f2f2f2;padding:8px 12px;border-radius:0;max-width:100%;word-break:break-word;font-size:15px;animation:f 7s linear forwards}
@keyframes f{0%,57%{opacity:1}100%{opacity:0}} /* solid for 4s, then fades out over 3s */
#stage.chat .fl{display:none}

/* Chat history: right quarter of the screen */
#pn{display:none;position:absolute;z-index:7;top:0;right:0;width:25%;min-width:200px;height:100%;background:#121212f0;flex-direction:column;justify-content:flex-end;padding:48px 8px 8px}
#stage.chat #pn{display:flex}
#pl{display:flex;flex-direction:column;gap:6px;overflow:auto;max-height:100%}
.pm{background:#2b2b2b;padding:8px 10px;align-self:flex-start;max-width:90%;word-break:break-word;font-size:14px}
.pm.me{align-self:flex-end}

#tb{position:absolute;z-index:8;left:0;right:0;bottom:0;padding:8px;background:#1a1a1a}
#ti{width:100%;border-radius:0}

#sb{position:absolute;z-index:10;top:50%;left:50%;transform:translate(-50%,-50%);width:min(420px,90%);background:#1a1a1dee;padding:16px;display:flex;flex-direction:column;gap:8px}
</style></head><body>

<div id="lobby">
  <h1>Watch Together</h1>
  <p class="s">Pick a room code, send it to your partner, and both of you join with the same code.</p>
  <input id="room" placeholder="Room code" autocapitalize="none">
  <button id="join">Join room</button>
</div>

<div id="stage" class="hide">
  <div id="mw"><div id="yt"></div></div>
  <video id="v" playsinline class="hide"></video>
  <div id="zl"></div><div id="zr"></div><div id="zt"></div>

  <div id="fL" class="fl"></div><div id="fR" class="fl"></div>
  <button id="ci">💬</button>
  <div id="pn"><div id="pl"></div></div>

  <div id="ctl" class="off">
    <input id="bar" type="range" min="0" max="1000" value="0">
    <div id="row">
      <button id="pp">▶</button><span id="tm">0:00 / 0:00</span><span style="flex:1"></span>
      <select id="sp"><option>0.5</option><option>0.75</option><option selected>1</option><option>1.25</option><option>1.5</option><option>2</option></select>
      <select id="ql" class="hide"></select>
      <button id="src">＋</button>
    </div>
  </div>

  <div id="tb" class="hide"><input id="ti" placeholder="Type a message and press Enter" enterkeyhint="send" autocomplete="off"></div>

  <div id="sb">
    <b>Choose what to watch</b>
    <input id="yu" placeholder="Paste a YouTube link">
    <button id="yg">Play link</button>
    <label class="btn" style="background:#2a2a2e">Upload a video<input type="file" id="fi" accept="video/*" hidden></label>
    <span id="up" style="font-size:14px;color:#aaa"></span>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let ws, room, dead, y, P, ready, pend, playing = false, rate = 1, drag = false, src = null, ctlT, tm, lt = 0, ls = 0;
const send = o => ws && ws.readyState == 1 && ws.send(JSON.stringify(o));
const fmt = s => { s = Math.floor(s || 0); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

/* ---------- join: fullscreen + landscape (needs a tap, so we do it here) ---------- */
$('room').value = Math.random().toString(36).slice(2, 6);
$('join').onclick = async () => {
  room = $('room').value.trim().toLowerCase(); if (!room) return;
  $('lobby').classList.add('hide'); $('stage').classList.remove('hide');
  try { await document.documentElement.requestFullscreen(); await screen.orientation.lock('landscape'); } catch (e) {}
  connect();
};
function connect() {
  ws = new WebSocket((location.protocol == 'https:' ? 'wss://' : 'ws://') + location.host + '/?room=' + encodeURIComponent(room));
  ws.onmessage = e => on(JSON.parse(e.data));
  ws.onclose = () => { if (!dead) setTimeout(connect, 2000); };
}
setInterval(() => send({ t: 'p' }), 25000); // keep-alive
function on(m) {
  if (m.t == 'full') { dead = 1; alert('This room already has two people.'); location.reload(); }
  else if (m.t == 'peer') { if (src) { send({ t: 'src', s: src }); if (ready) send(snap()); } } // bring the newcomer up to date
  else if (m.t == 'src') load(m.s, false);
  else if (m.t == 'state') apply(m);
  else if (m.t == 'chat') addMsg(m.m, false);
}

/* ---------- sync ---------- */
const snap = () => ({ t: 'state', playing, time: P ? P.time() : 0, rate });
function ctl(p) { if (!P) return; const s = { ...snap(), ...p }; apply(s); send(s); } // local action: apply + tell partner
function apply(s) {
  if (!ready) { pend = s; return; }
  playing = s.playing; rate = s.rate;
  if (s.seek || Math.abs(P.time() - s.time) > (playing ? 1.5 : 0.3)) P.seek(s.time);
  P.setRate(rate); playing ? P.play() : P.pause();
  $('pp').textContent = playing ? '⏸' : '▶'; $('sp').value = rate;
}

/* ---------- loading a source ---------- */
function load(s, go) {
  const valid = s.k == 'yt' ? /^[\w-]{11}$/.test(s.id) : s.k == 'file' && /^\/uploads\/\w+\.\w+$/.test(s.u);
  if (!valid) return;
  src = s; ready = false; pend = null; P = null; playing = false;
  $('sb').classList.add('hide'); $('ql').classList.add('hide'); $('ql').innerHTML = '';
  $('mw').innerHTML = '<div id="yt"></div>';
  const v = $('v'); v.pause(); v.removeAttribute('src'); v.classList.add('hide');
  if (s.k == 'file') return loadFile(s.u, go);
  const run = () => { y = new YT.Player('yt', { videoId: s.id,
    playerVars: { controls: 0, disablekb: 1, playsinline: 1, rel: 0, fs: 0, modestbranding: 1 },
    events: {
      onReady: () => { P = { play: () => y.playVideo(), pause: () => y.pauseVideo(), seek: t => y.seekTo(t, true),
        time: () => y.getCurrentTime() || 0, dur: () => y.getDuration() || 0, setRate: r => y.setPlaybackRate(r) }; started(go); },
      onStateChange: e => e.data == 1 && fillQ() } }); };
  if (window.YT && YT.Player) run();
  else { window.onYouTubeIframeAPIReady = run;
    if (!$('yta')) { const t = document.createElement('script'); t.id = 'yta'; t.src = 'https://www.youtube.com/iframe_api'; document.head.append(t); } }
}
function loadFile(u, go) {
  const v = $('v'); v.classList.remove('hide');
  P = { play: () => v.play().catch(() => {}), pause: () => v.pause(), seek: t => v.currentTime = t,
    time: () => v.currentTime, dur: () => v.duration || 0, setRate: r => v.playbackRate = r };
  v.onloadedmetadata = () => started(go); v.src = u;
}
function started(go) {
  ready = true;
  if (pend) { const p = pend; pend = null; apply(p); } else if (go) ctl({ playing: true, time: 0, seek: 1 });
  showCtl();
}
function fillQ() { // quality is personal: it is never sent to your partner
  const q = $('ql'), l = y.getAvailableQualityLevels();
  if (!l.length || q.options.length) return;
  q.innerHTML = l.map(x => `<option>${x}</option>`).join(''); q.classList.remove('hide');
}
$('ql').onchange = e => y && y.setPlaybackQuality(e.target.value);

$('yg').onclick = () => {
  const m = $('yu').value.match(/(?:v=|youtu\.be\/|embed\/|shorts\/|live\/)([\w-]{11})/);
  if (!m) { $('up').textContent = 'That is not a YouTube link.'; return; }
  const s = { k: 'yt', id: m[1] }; load(s, true); send({ t: 'src', s });
};
$('fi').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const x = new XMLHttpRequest(); x.open('POST', '/upload?ext=' + (f.name.split('.').pop() || '').toLowerCase());
  x.upload.onprogress = p => $('up').textContent = 'Uploading ' + Math.round(p.loaded / p.total * 100) + '%';
  x.onload = () => { try { const s = { k: 'file', u: JSON.parse(x.responseText).url }; load(s, true); send({ t: 'src', s }); }
    catch (err) { $('up').textContent = 'Upload failed. Use mp4, webm, mov, m4v or ogv.'; } };
  x.onerror = () => $('up').textContent = 'Upload failed.';
  x.send(f);
};

/* ---------- controls ---------- */
$('pp').onclick = () => ctl({ playing: !playing });
$('sp').onchange = e => ctl({ rate: +e.target.value });      // speed is shared
$('bar').oninput = () => { drag = true; if (P) $('tm').textContent = fmt($('bar').value / 1000 * P.dur()) + ' / ' + fmt(P.dur()); };
$('bar').onchange = () => { if (P) ctl({ time: $('bar').value / 1000 * P.dur(), seek: 1 }); drag = false; };
$('src').onclick = () => $('sb').classList.toggle('hide');
$('ctl').onpointerdown = showCtl;
function showCtl() { $('ctl').classList.remove('off'); clearTimeout(ctlT); ctlT = setTimeout(() => playing && $('ctl').classList.add('off'), 3500); }
function toggleCtl() { $('ctl').classList.contains('off') ? showCtl() : $('ctl').classList.add('off'); }
setInterval(() => { if (!P || drag) return; const d = P.dur(), t = P.time(); $('bar').value = d ? t / d * 1000 : 0; $('tm').textContent = fmt(t) + ' / ' + fmt(d); }, 300);

// double tap: right side = +10s, left side = -10s. Single tap shows/hides controls.
function tap(d, el) {
  const n = Date.now(); clearTimeout(tm);
  if (n - lt < 300 && ls == d) {
    lt = 0; if (P) ctl({ time: Math.max(0, Math.min(P.dur(), P.time() + d * 10)), seek: 1 });
    const x = document.createElement('div'); x.className = 'fx'; x.textContent = d < 0 ? '⏪ 10s' : '10s ⏩';
    el.append(x); setTimeout(() => x.remove(), 600);
  } else { lt = n; ls = d; tm = setTimeout(toggleCtl, 300); }
}
$('zl').onclick = () => tap(-1, $('zl')); $('zr').onclick = () => tap(1, $('zr'));

/* ---------- chat ---------- */
function addMsg(m, mine) {
  const b = document.createElement('div'); b.className = 'b'; b.textContent = m;
  (mine ? $('fR') : $('fL')).append(b); setTimeout(() => b.remove(), 7000); // new message goes below, old ones move up
  const h = document.createElement('div'); h.className = 'pm' + (mine ? ' me' : ''); h.textContent = m;
  $('pl').append(h); $('pl').scrollTop = 1e9;
}
$('ci').onclick = () => $('stage').classList.toggle('chat');
$('zt').onclick = () => { $('tb').classList.remove('hide'); $('ti').focus(); }; // bottom quarter opens the keyboard
$('ti').onblur = () => $('tb').classList.add('hide');
$('ti').onkeydown = e => {
  if (e.key != 'Enter') return;
  const m = e.target.value.trim(); if (m) { send({ t: 'chat', m }); addMsg(m, true); }
  e.target.value = '';
};
</script></body></html>
